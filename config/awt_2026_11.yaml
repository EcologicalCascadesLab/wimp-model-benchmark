# Benchmark run specification: Australian Wet Tropics, November 2026
test_set: awt_2026_11
description: >
  Wet Tropics classifier and MegaDetector benchmark on human-validated images
  from Skye Anderson's AWT camera-trap projects (PROD and TEST).
data_source_location: Australian Wet Tropics, Queensland
data_collation_process: >
  Images drawn from sequences that a person validated on WIMP, sampled across
  cameras and sequences (at most `max_per_sequence` images from any one sequence).

# Where the validated images come from (read-only: GET requests only).
sources:
  - env: prod
    project_name: "Wet Tropics Camera Trapping 2025 Skye Cassowary Production Environment"
    project_id: "b8b6ef55-ebe7-47f7-9034-b977399b77a2"
  - env: test
    project_name: "Wet Tropics Camera Trapping 2025 Skye Cassowary"
    project_id: "c31c2bf4-d660-44f8-bf4c-991a94e8f191"
  # candidate, check before use: "Luskin WildObs QLD AWT private properties UQ ECL" (prod, 8b3ccc87-5e16-4d9b-95fc-88334b8d950d)

sampling:
  per_class: 250
  max_per_sequence: 2        # spread the sample across sequences
  max_share_per_camera: 0.2  # no camera supplies more than 20% of a class
  seed: 20261103
  # class in the test set -> how it is tagged on WIMP (the true label) and which
  # validated source labels feed it. in_model: whether the Wet Tropics model has a
  # matching class (judged from the labels the model itself writes on TEST).
  classes:
    Blank:                    {tag: blank, source_labels: [blank]}
    Human:                    {tag: Homo sapiens, source_labels: [Homo sapiens]}
    Vehicle:                  {tag: vehicle, source_labels: [vehicle]}
    Alectura lathami:         {tag: Alectura lathami, source_labels: [Alectura lathami]}
    Bos taurus:               {tag: Bos taurus, source_labels: [Bos taurus]}
    Canis lupus familiaris:   {tag: Canis lupus familiaris, source_labels: [Canis lupus familiaris]}
    Canis lupus dingo:        {tag: Canis lupus dingo, source_labels: [Canis lupus dingo], in_model: false}
    Casuarius casuarius:      {tag: Casuarius casuarius, source_labels: [Casuarius casuarius]}
    Felis catus:              {tag: Felis catus, source_labels: [Felis catus]}
    Heteromyias cinereifrons: {tag: Heteromyias cinereifrons, source_labels: [Heteromyias cinereifrons]}
    Hypsiprymnodon moschatus: {tag: Hypsiprymnodon moschatus, source_labels: [Hypsiprymnodon moschatus]}
    Megapodius reinwardt:     {tag: Megapodius reinwardt, source_labels: [Megapodius reinwardt]}
    Orthonyx spaldingii:      {tag: Orthonyx spaldingii, source_labels: [Orthonyx spaldingii]}
    Perameles nasuta:         {tag: Perameles nasuta, source_labels: [Perameles nasuta]}
    Sus scrofa:               {tag: Sus scrofa, source_labels: [Sus scrofa]}
    Thylogale stigmatica:     {tag: Thylogale stigmatica, source_labels: [Thylogale stigmatica]}
    Uromys caudimaculatus:    {tag: Uromys caudimaculatus, source_labels: [Uromys caudimaculatus]}
    Wallabia bicolor:         {tag: Wallabia bicolor, source_labels: [Wallabia bicolor]}
    Muridae:                  {tag: Muridae, source_labels: [Muridae], in_model: false}

# One benchmark project per model run. Projects are created in the WIMP UI
# (docs/03_wimp_projects.Rmd); paste each project_id here afterwards.
project_settings:            # set in the WIMP UI on 3 Nov 2026
  sequence_cutoff_seconds: 0
  ai_model: WildObs_QLD WetTropics
  organisation: University of Queensland (UQ)
  ai_sharing: Private          # benchmark images must never enter model training
runs:
  - id: prod_awt_default
    env: prod
    project_name: "Model benchmark testing: Wet Tropics (PROD default)"
    classifier: Wet Tropics
    detector_threshold: default
    project_id: "efbbf6a5-c02c-4e32-aa53-431b25c77de4"
  - id: test_awt_md025
    env: test
    project_name: "Model benchmark testing: Wet Tropics, MegaDetector 0.25"
    classifier: Wet Tropics
    detector_threshold: 0.25
    project_id: "d39a5b2e-634b-47c5-a8ac-18f94e28452f"
  - id: test_awt_md050
    env: test
    project_name: "Model benchmark testing: Wet Tropics, MegaDetector 0.50"
    classifier: Wet Tropics
    detector_threshold: 0.50
    project_id: "792b86de-07f3-4e8f-9944-cbcff705202c"
  - id: test_awt_md075
    env: test
    project_name: "Model benchmark testing: Wet Tropics, MegaDetector 0.75"
    classifier: Wet Tropics
    detector_threshold: 0.75
    project_id: "007ab270-90b9-4ce8-8366-d3f151c6e260"

  - id: prod_md_v6
    env: prod
    project_name: "Model benchmark testing: MegaDetector V6 only (PROD default)"
    classifier: Megadetector V6 (no species classifier)
    detector_threshold: default
    project_id: "c7f0dcd4-7006-45c5-a328-85ff42831e5d"

evaluation:
  thresholds: [0.5, 0.6, 0.7, 0.8, 0.9]
  observation_level: event
  template: full
